;-------------------------
; Catppuccin Mocha Palette
; Maintainer: Yukiteru
;--------------------------

[colors]
rosewater = #f5e0dc
flamingo = #f2cdcd
pink = #f5c2e7
mauve = #cba6f7
red = #f38ba8
maroon = #eba0ac
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
blue = #89b4fa
lavender = #b4befe
text = #cdd6f4
subtext1 = #bac2de
subtext0 = #a6adc8
overlay2 = #9399b2
overlay1 = #7f849c
overlay0 = #6c7086
surface2 = #585b70
surface1 = #45475a
surface0 = #313244
base = #1e1e2e
mantle = #181825
crust = #11111b
transparent = #FF00000

[settings]
screenchange-reload = true

[bar/top]
;; Position for bar 
width = 100%
height = 22
offset-x = 0
offset-y = 0
fixed-center = true
monitor = DP-1
background = ${colors.base}
foreground = ${colors.text}
padding-left = 0
padding-right = 0
module-margin-left = 1
module-margin-right = 1
font-0 = Fira Mono:style=Regular:size=8
font-1 = NotoSans Nerd Font:style=Bold:size=8
font-2 = HanaMinB,花園明朝B:style=Regular:size=8
font-3 = Sazanami Mincho,さざなみ明朝:style=Mincho-Regular,Regular:size=8
line-size = 2pt
separator = |
separator-foreground = ${colors.mauve}
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

;; Modules for bar
modules-left = xworkspaces xwindow
modules-right = mpd cpu temperature memory wired-network vpn pulseaudio xkeyboard date tray

[module/mpd]
type = internal/mpd
host = 127.0.0.1
port = 6600
interval = 2
label-song =  MPD: %artist% - %title%

[module/cpu]
type = internal/cpu
interval = 5
format-prefix = " CPU:"
label = %percentage:2%%
warn-percentage = 90
format-prefix-font = 0

[module/temperature]
type = internal/temperature
hwmon-path = /sys/devices/pci0000:00/0000:00:18.3/hwmon/hwmon3/temp1_input
interval = 5
format = 󰈸<label>
label-padding = 1

[module/memory]
type = internal/memory
format-prefix = "󰍛 Memory: "
interval = 5
label-padding = 1
label = %gb_used%/%gb_free%
warn-percentage = 95

[module/wired-network]
type = custom/script
exec = $HOME/.config/polybar/scripts/lan.sh
interval = 5
format-prefix-font = 0
format = 󰢭 LAN: <label>
label-padding = 1
label = %output%

[module/vpn]
type = custom/script
exec = $HOME/.config/polybar/scripts/vpn.sh
interval = 5
format-prefix-font = 0
format = 󰢭 VPN: <label>
label-padding = 1
label = %output%

[module/pulseaudio]
type = internal/pulseaudio
sink = alsa_output.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo-output
interval = 5
label = %output%
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-volume = %percentage%%
label-muted =   muted
label-muted-foreground = ${colors.red}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = pavucontrol

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>
format-spacing = 0
label-layout = %icon% %layout%
label-layout-padding = 0
layout-icon-default =  

[module/date]
type = internal/date
interval = 5
date = %Y-%m-%d - %H:%M
date-alt = %Y-%m-%d
label-padding = 1
label = %date%
format = <label>

[module/xworkspaces]
type = internal/xworkspaces
icon-1 = one;1
icon-2 = two;2
icon-3 = three;3
icon-4 = four;4
icon-5 = five;5
icon-6 = six;6
icon-7 = seven;7
icon-8 = eight;8
icon-9 = nine;9
icon-10 = ten;10
format-prefix-font = 0

[module/tray]
type = internal/tray
format-margin = 4px
tray-spacing = 4px
tray-padding = 1

;; Active desktops
label-active-foreground = ${colors.green}
label-active-background = ${colors.base}
label-active-padding = 0

;; Occupied desktops
label-occupied-foreground = ${colors.blue}
label-occupied-background = ${colors.base}
label-occupied-padding = 0

;; Urgent desktops
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.base}
label-urgent-padding = 0

;; Empty desktops
label-empty-foreground = ${colors.blue}
label-empty-background = ${colors.base}
label-empty-padding = 0

[module/xwindow]
type = internal/xwindow
format = <label>
label =  %title:0:60:...%
